# Tanda 12: el modelo del banco de la línea O, corrido por el retroanálisis sobre la base común.
#
# Los hiperparámetros no son una elección nueva: son los del script que produjo
# `datos/retro/ventana_expansiva.json` (experimentos/tanda_07/origen_movil.py), es decir
# n_estimators=300, max_depth=4, learning_rate=0.05, subsample=0.8, colsample_bytree=0.8.
# EXP001 no sirve para esto: es un XGBoost de 4 rondas y profundidad 2.
#
# Este brazo agrega el bloque de margen de la línea G. G se confirmó sobre esta familia en la
# tanda 5 y sobre este mismo banco en la tanda 7 (388 -> 467 inicios de 647). La tanda 11 mostró
# que no se reproduce sobre una logística, porque el log1p deja que el modelo arme el margen solo.
# Un árbol no puede: tiene que aproximar un cociente con cortes sucesivos. Esta corrida decide si
# la línea G se sostiene sobre la base común o pasa a 'no reproducida'.
#
