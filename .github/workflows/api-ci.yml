name: API CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Filter steps rather than the workflow so required checks always report.
      - name: Detect relevant paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-paths; then
            if grep -E '^(app/api/|datos/resultados/|scripts/construir_resultados\.py$|pipeline/src/sat_dengue_pipeline/pipelines/deployment_publication/|app/dashboard/src/lib/dashboard-contract\.ts$|\.github/workflows/api-ci\.yml$)' /tmp/changed-paths; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            exit 1
          fi
      - uses: actions/setup-python@v7
        if: steps.paths.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Install API dependencies
        if: steps.paths.outputs.changed == 'true'
        run: python -m pip install -r app/api/requirements-dev.txt
      - name: Test API
        if: steps.paths.outputs.changed == 'true'
        working-directory: app/api
        run: python -m pytest
