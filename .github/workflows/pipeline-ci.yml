name: Pipeline CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Pipeline quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Keep the required check reporting even when the component is unchanged.
      - name: Detect relevant paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-paths; then
            if grep -E '^(pipeline/|\.github/workflows/pipeline-ci\.yml$)' /tmp/changed-paths; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            exit 1
          fi
      - uses: actions/setup-python@v7
        if: steps.paths.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.paths.outputs.changed == 'true'
        with:
          version: '0.11.19'
          enable-cache: false
      - name: Check lockfile
        if: steps.paths.outputs.changed == 'true'
        run: uv lock --check --project pipeline
      - name: Install locked pipeline dependencies
        if: steps.paths.outputs.changed == 'true'
        run: uv sync --locked --project pipeline
      - name: Lint pipeline
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline ruff check .
      - name: Test pipeline
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline pytest
      - name: Run synthetic Kedro pipeline
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline kedro run --pipelines synthetic
