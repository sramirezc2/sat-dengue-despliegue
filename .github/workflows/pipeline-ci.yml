name: Pipeline CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Pipeline quality
    runs-on: ubuntu-latest
    # Complete suites exceed 15–20 minutes on hosted Linux/Windows runners.
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Keep the required check reporting even when the component is unchanged.
      - name: Detect relevant paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-paths; then
            if grep -E '^(pipeline/|demo/|streamlit_app\.py$|requirements\.txt$|scripts/construir_resultados\.py$|datos/resultados/|app/api/|app/dashboard/|contracts/|\.github/workflows/pipeline-ci\.yml$)' /tmp/changed-paths; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            exit 1
          fi
      - uses: actions/setup-python@v7
        if: steps.paths.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.paths.outputs.changed == 'true'
        with:
          version: '0.11.19'
          enable-cache: false
      - name: Check lockfile
        if: steps.paths.outputs.changed == 'true'
        run: uv lock --check --project pipeline
      - name: Install locked pipeline dependencies
        if: steps.paths.outputs.changed == 'true'
        run: uv sync --locked --project pipeline
      - name: Lint pipeline
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline ruff check .
      - name: Install isolated demo environment
        if: steps.paths.outputs.changed == 'true'
        run: |
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/demo/.venv" uv sync --locked --project pipeline
          # Resolve every dependency, including those absent on the runner's OS.
          for platform in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            uv pip install --python demo/.venv/bin/python --python-platform "$platform" --python-version 3.12 --only-binary=:all: --require-hashes --reinstall --dry-run -r demo/requirements.lock
          done
          uv pip install --python demo/.venv/bin/python --require-hashes -r demo/requirements.lock
      - name: Lint and test Streamlit demo explicitly
        if: steps.paths.outputs.changed == 'true'
        run: |
          uv run --locked --project pipeline ruff check --config pipeline/pyproject.toml demo/app.py demo/inferencia.py demo/configuracion.py demo/contexto_paquete.py demo/ejemplos.py demo/respaldo_cientifico.py demo/tests streamlit_app.py
          demo/.venv/bin/python -m pytest demo/tests -q
      - name: Verify Community Cloud installation
        if: steps.paths.outputs.changed == 'true'
        run: |
          uv venv /tmp/satd-cloud --python 3.12
          uv pip install --python /tmp/satd-cloud/bin/python -r requirements.txt
          /tmp/satd-cloud/bin/python -c "from sat_dengue_pipeline.risk.configuration import ROOT; from pathlib import Path; assert ROOT == Path.cwd(); import streamlit; import huggingface_hub"
      - uses: actions/setup-node@v7
        if: steps.paths.outputs.changed == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: steps.paths.outputs.changed == 'true'
        with:
          bun-version: '1.4.4'
      - name: Prepare API and dashboard for complete E2E
        if: steps.paths.outputs.changed == 'true'
        run: |
          uv venv app/api/.venv --python 3.12
          uv pip install --python app/api/.venv -r app/api/requirements-dev.txt
          bun install --frozen-lockfile --cwd app/dashboard
      - name: Test pipeline
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline pytest
      - name: Run synthetic Kedro pipeline
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline kedro run --pipelines synthetic
      - name: Build canonical synthetic fixture
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline kedro run --pipelines canonical_build
      - name: Certify canonical fixture N=3
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline kedro run --pipelines canonical_reproducibility
      - name: Publish synthetic deployment fixture
        if: steps.paths.outputs.changed == 'true'
        run: uv run --directory pipeline kedro run --pipelines deployment_publication

  portability:
    name: Pipeline portability (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    env:
      DO_NOT_TRACK: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      MLFLOW_DISABLE_TELEMETRY: 'true'
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.11.19'
          enable-cache: false
      # A single Python coordinator calls the unchanged CLI on each native shell.
      # No Bash, environment dump, provider credentials or scientific source data.
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install libomp
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Prepare API and dashboard for complete E2E
        run: |
          uv venv app/api/.venv --python 3.12
          uv pip install --python app/api/.venv -r app/api/requirements-dev.txt
          bun install --frozen-lockfile --cwd app/dashboard
      - name: Run locked portability gates
        run: python pipeline/tools/check_portability.py
      - name: Upload small environment receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-portability-${{ matrix.platform }}
          path: pipeline/data/portability/receipt.json
          if-no-files-found: error
          retention-days: 14
