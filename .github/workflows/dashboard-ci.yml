name: Dashboard CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Dashboard quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Filter steps rather than the workflow so required checks always report.
      - name: Detect relevant paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-paths; then
            if grep -E '^(app/dashboard/|\.github/workflows/dashboard-ci\.yml$)' /tmp/changed-paths; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            exit 1
          fi
      - uses: actions/setup-node@v7
        if: steps.paths.outputs.changed == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: steps.paths.outputs.changed == 'true'
        with:
          bun-version: '1.4.4'
      - name: Install locked dashboard dependencies
        if: steps.paths.outputs.changed == 'true'
        working-directory: app/dashboard
        run: bun install --frozen-lockfile
      - name: Lint dashboard
        if: steps.paths.outputs.changed == 'true'
        working-directory: app/dashboard
        run: bun run lint
      - name: Test dashboard
        if: steps.paths.outputs.changed == 'true'
        working-directory: app/dashboard
        run: bun run test
      - name: Build dashboard
        if: steps.paths.outputs.changed == 'true'
        working-directory: app/dashboard
        run: NITRO_PRESET=node_server bun run build
